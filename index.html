<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çanakkale Portalı</title>

  <!-- İkon Dosyasını Tanımlama -->
  <link rel="icon" href="icons/icon.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(122, 89, 89, 0.633);
      font-family: monospace;
      margin: 0;
      padding: 0;
      color: black;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 540px;
      padding: 20px;
      margin: 0 auto;
    }

    /* Hava Durumu Bandı (Retro Brutalist) */
    .weather-widget {
      background-color: #8d9cf4;
      border: 3px solid black;
      border-radius: 8px;
      padding: 10px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 3px 3px 0px black;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .weather-widget.loaded {
      opacity: 1;
    }

    .weather-temp {
      font-size: 1.25em;
    }

    .weather-desc {
      font-size: 1.05em;
      border-left: 2px solid black;
      padding-left: 12px;
    }

    /* Ana Kutu */
    .box-container {
      border: 7px solid black;
      background-color: #d3d3d3;
      padding: 28px 24px;
      border-radius: 12px;
      text-align: center;
    }

    .box-header {
      margin-top: 0;
      margin-bottom: 24px;
      background-color: #8d9cf4;
      color: black;
      padding: 14px;
      text-align: center;
      border: 4px solid black;
      font-size: 1.5em;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-btn {
      font-family: monospace;
      font-size: 1.25em;
      font-weight: bold;
      padding: 16px 22px;
      background-color: #f0f0f0;
      border: 3px solid black;
      border-radius: 8px;
      color: black;
      text-decoration: none;
      box-shadow: 3px 3px 0px black;
      transition: all 0.15s ease;
      display: block;
      text-align: center;
    }

    .menu-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px black;
    }

    .menu-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px black;
    }

    @media (max-width: 600px) {
      .container {
        padding: 14px 10px;
      }

      .box-container {
        border-width: 5px;
        border-radius: 10px;
        padding: 20px 14px;
      }

      .box-header {
        font-size: 1.3em;
        padding: 12px;
        border-width: 3px;
      }

      .menu-btn {
        font-size: 1.1em;
        padding: 14px 18px;
      }

      .weather-widget {
        font-size: 0.95em;
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Hava Durumu Widget -->
    <div class="weather-widget" id="weather-widget">
      <span class="weather-temp" id="weather-temp">--°C</span>
      <span class="weather-desc" id="weather-desc">Çanakkale Hava Durumu Yükleniyor...</span>
    </div>

    <div class="box-container">
      <h1 class="box-header">ÇANAKKALE</h1>

      <div class="menu-list">
        <a href="sayfalar/okul.html" class="menu-btn">OKUL</a>
        <a href="sayfalar/canakkale.html" class="menu-btn">ÇANAKKALE</a>
        <a href="sayfalar/yemek.html" class="menu-btn">YEMEK</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Hava Durumu Çekme (Çanakkale: 40.1553° K, 26.4082° D)
      async function fetchWeather() {
        try {
          const url = "https://api.open-meteo.com/v1/forecast?latitude=40.1553&longitude=26.4082&current=temperature_2m,weather_code&timezone=Europe%2FIstanbul";
          const res = await fetch(url);
          if (!res.ok) throw new Error("Weather API hatası");
          const data = await res.json();

          const temp = Math.round(data.current.temperature_2m);
          const code = data.current.weather_code;

          let desc = "Güneşli";

          if (code === 1 || code === 2) { desc = "Parçalı Bulutlu"; }
          else if (code === 3) { desc = "Çok Bulutlu"; }
          else if (code >= 45 && code <= 48) { desc = "Sisli"; }
          else if (code >= 51 && code <= 67) { desc = "Yağmurlu"; }
          else if (code >= 71 && code <= 77) { desc = "Kar Yağışlı"; }
          else if (code >= 80 && code <= 82) { desc = "Sağanak Yağışlı"; }
          else if (code >= 95 && code <= 99) { desc = "Fırtınalı"; }

          const hour = new Date().getHours();
          if ((hour >= 19 || hour <= 6) && code === 0) { desc = "Açık"; }
          else if ((hour >= 19 || hour <= 6) && (code === 1 || code === 2)) { desc = "Parçalı Bulutlu"; }

          document.getElementById("weather-temp").textContent = temp + "°C";
          document.getElementById("weather-desc").textContent = "Çanakkale • " + desc;
          document.getElementById("weather-widget").classList.add("loaded");
        } catch (e) {
          console.error("Hava durumu çekilemedi:", e);
          document.getElementById("weather-desc").textContent = "Çanakkale";
          document.getElementById("weather-widget").classList.add("loaded");
        }
      }

      fetchWeather();
    });
  </script>
</body>

</html>
