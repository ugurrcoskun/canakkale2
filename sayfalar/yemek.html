<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yemek Menüsü — Çanakkale</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(122, 89, 89, 0.633);
      font-family: monospace;
      margin: 0;
      padding: 0;
      color: black;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Geri Dön Butonu */
    .back-btn {
      display: inline-block;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      color: black;
      text-decoration: none;
      background-color: #f0f0f0;
      border: 2px solid black;
      border-radius: 6px;
      padding: 8px 16px;
      box-shadow: 2px 2px 0px black;
      margin-bottom: 18px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-1px, -1px);
    }

    /* Ana Kutu */
    .box-container {
      border: 7px solid black;
      background-color: #d3d3d3;
      padding: 24px;
      margin: 0 auto 30px auto;
      border-radius: 12px;
    }

    .box-header {
      margin-top: 0;
      margin-bottom: 12px;
      background-color: #8d9cf4;
      color: black;
      padding: 12px;
      text-align: center;
      border: 4px solid black;
      font-size: 1.4em;
      border-radius: 8px;
    }

    .menu-meta {
      text-align: center;
      font-size: 1em;
      font-weight: bold;
      color: #222;
      margin: 0 0 18px 0;
    }

    /* Tarih Seçme Çubuğu */
    .menu-date-tools {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding: 14px;
      background-color: #f0f0f0;
      border: 3px solid black;
      border-radius: 8px;
      box-shadow: 2px 2px 0px black;
    }

    .menu-date-label {
      font-size: 1.05em;
      font-weight: bold;
      color: black;
    }

    .menu-date-input {
      font-family: monospace;
      font-size: 1em;
      font-weight: bold;
      padding: 8px 12px;
      border: 2px solid black;
      border-radius: 6px;
      background: #fff;
      color: black;
    }

    .menu-date-btn {
      font-family: monospace;
      font-size: 1em;
      font-weight: bold;
      padding: 8px 16px;
      border: 2px solid black;
      border-radius: 6px;
      background: #8d9cf4;
      color: black;
      cursor: pointer;
      box-shadow: 1px 1px 0px black;
      transition: all 0.15s ease;
    }

    .menu-date-btn:hover {
      background: #7b8ae0;
      transform: translate(-1px, -1px);
    }

    /* Menü Kartları Izgarası */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .menu-card {
      background-color: #f8f8f8;
      border: 4px solid black;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 3px 3px 0px black;
      display: flex;
      flex-direction: column;
    }

    .menu-card__tag {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.95em;
      font-weight: bold;
      padding: 4px 10px;
      border: 2px solid black;
      border-radius: 6px;
      background-color: #8d9cf4;
      color: black;
      margin-bottom: 10px;
    }

    .menu-card--sabah .menu-card__tag {
      background-color: #fbc27e;
    }

    .menu-card--aksam .menu-card__tag {
      background-color: #a8d5ba;
    }

    .menu-card__date {
      font-size: 1.15em;
      font-weight: bold;
      margin: 0 0 12px 0;
      color: black;
      border-bottom: 2px solid black;
      padding-bottom: 6px;
    }

    .menu-card__list {
      list-style: none;
      padding: 0;
      margin: 0 0 14px 0;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-card__list li {
      font-size: 1em;
      line-height: 1.35;
      padding-left: 14px;
      position: relative;
    }

    .menu-card__list li::before {
      content: "•";
      position: absolute;
      left: 0;
      font-weight: bold;
      color: black;
    }

    .menu-card__footer {
      border-top: 2px dashed black;
      padding-top: 8px;
      margin-top: auto;
      font-size: 0.95em;
      font-weight: bold;
      color: #333;
    }

    .menu-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      font-size: 1.1em;
      background-color: #f8f8f8;
      border: 3px solid black;
      border-radius: 8px;
    }

    /* Alt Butonlar */
    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      flex: 1 1 180px;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      padding: 12px 16px;
      border: 3px solid black;
      border-radius: 8px;
      background-color: #f0f0f0;
      color: black;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px black;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-1px, -1px);
    }

    /* Mobil Uyumluluk */
    @media (max-width: 600px) {
      .container {
        padding: 12px 8px;
      }

      .box-container {
        border-width: 5px;
        border-radius: 10px;
        padding: 16px 12px;
      }

      .box-header {
        font-size: 1.2em;
        padding: 10px;
        border-width: 3px;
      }

      .menu-date-tools {
        flex-direction: column;
        align-items: stretch;
      }

      .menu-date-input,
      .menu-date-btn {
        width: 100%;
        text-align: center;
      }

      .action-btn {
        flex: 1 1 100%;
        font-size: 1em;
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="../index.html" class="back-btn">‹ Ana Sayfa</a>

    <div class="box-container">
      <h3 class="box-header">ÖSEM ve KYK Menüsü</h3>
      <p class="menu-meta" id="menu-status">Güncel menü yükleniyor...</p>

      <!-- Gün Seçici Araçlar -->
      <div class="menu-date-tools">
        <label class="menu-date-label" for="menu-date-picker">Gün seç:</label>
        <input class="menu-date-input" id="menu-date-picker" type="date" />
        <button class="menu-date-btn" id="menu-date-today" type="button">Bugün</button>
      </div>

      <!-- Menü Kartları Izgarası -->
      <div class="menu-grid" id="menu-grid"></div>

      <!-- Alt Eylemler -->
      <div class="action-bar">
        <a class="action-btn" href="https://yemek.comu.edu.tr/" target="_blank" rel="noopener noreferrer">ÖSEM Kaynağı</a>
        <a class="action-btn" href="https://yurtmenu.net/canakkale" target="_blank" rel="noopener noreferrer">KYK Kaynağı</a>
        <a class="action-btn" href="kyk-foto.html">KYK Fotoğrafları</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const menuGrid = document.getElementById("menu-grid");
      const menuStatus = document.getElementById("menu-status");
      const menuDatePicker = document.getElementById("menu-date-picker");
      const menuDateTodayButton = document.getElementById("menu-date-today");
      const menuDataUrl = "../data/yemek.json";
      let loadedMenuData = null;
      let availableDates = [];

      function getIstanbulTodayIso() {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Istanbul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(new Date());
      }

      function getDayData(source, isoDate) {
        const days = source?.monthly?.days || {};
        return days[isoDate] || null;
      }

      function normalizeAvailableDates(data) {
        const set = new Set();
        Object.keys(data?.osem?.monthly?.days || {}).forEach((d) => set.add(d));
        Object.keys(data?.kyk?.monthly?.days || {}).forEach((d) => set.add(d));
        return Array.from(set).sort();
      }

      function createMenuCard({ accentClass, tag, date, items, calories }) {
        const card = document.createElement("article");
        card.className = `menu-card ${accentClass}`;

        const tagElement = document.createElement("div");
        tagElement.className = "menu-card__tag";
        tagElement.textContent = tag;

        const dateElement = document.createElement("h2");
        dateElement.className = "menu-card__date";
        dateElement.textContent = date || "Bugün";

        const list = document.createElement("ul");
        list.className = "menu-card__list";

        if (items.length === 0) {
          const empty = document.createElement("li");
          empty.textContent = "Veri bulunamadı.";
          list.appendChild(empty);
        } else {
          items.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
          });
        }

        card.appendChild(tagElement);
        card.appendChild(dateElement);
        card.appendChild(list);

        if (calories) {
          const footer = document.createElement("div");
          footer.className = "menu-card__footer";
          footer.textContent = calories;
          card.appendChild(footer);
        }

        return card;
      }

      function renderForDate(isoDate) {
        if (!loadedMenuData || !menuGrid || !menuStatus) {
          return;
        }

        const data = loadedMenuData;
        const osemDay = getDayData(data.osem, isoDate);
        const kykDay = getDayData(data.kyk, isoDate);

        const osem = osemDay || {
          date: data?.osem?.date || "",
          items: data?.osem?.items || [],
        };

        const kykSabah = (kykDay && kykDay.sabah) || {
          date: data?.kyk?.sabah?.date || "",
          items: data?.kyk?.sabah?.items || [],
          calories: data?.kyk?.sabah?.calories || "",
        };

        const kykAksam = (kykDay && kykDay.aksam) || {
          date: data?.kyk?.aksam?.date || "",
          items: data?.kyk?.aksam?.items || [],
          calories: data?.kyk?.aksam?.calories || "",
        };

        const cards = [
          createMenuCard({
            accentClass: "menu-card--osem",
            tag: "ÖSEM",
            date: osem.date,
            items: osem.items || [],
            calories: "",
          }),
          createMenuCard({
            accentClass: "menu-card--sabah",
            tag: "KYK Sabah",
            date: kykSabah.date,
            items: kykSabah.items || [],
            calories: kykSabah.calories || "",
          }),
          createMenuCard({
            accentClass: "menu-card--aksam",
            tag: "KYK Akşam",
            date: kykAksam.date,
            items: kykAksam.items || [],
            calories: kykAksam.calories || "",
          }),
        ];

        menuGrid.innerHTML = "";
        cards.forEach((card) => menuGrid.appendChild(card));

        const lastUpdated = data.generatedAt ? new Date(data.generatedAt) : null;
        const updatedText = lastUpdated && !Number.isNaN(lastUpdated.getTime())
          ? `Son güncelleme: ${lastUpdated.toLocaleString("tr-TR")}`
          : "Güncel menü yüklendi.";
        menuStatus.textContent = `${isoDate} - ${updatedText}`;
      }

      async function loadMenu() {
        if (!menuGrid || !menuStatus || !menuDatePicker || !menuDateTodayButton) {
          return;
        }

        try {
          const response = await fetch(menuDataUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Menü dosyası alınamadı");
          }

          loadedMenuData = await response.json();
          availableDates = normalizeAvailableDates(loadedMenuData);

          const todayIso = getIstanbulTodayIso();
          const initialDate = availableDates.includes(todayIso)
            ? todayIso
            : (availableDates[0] || todayIso);

          if (availableDates.length > 0) {
            menuDatePicker.min = availableDates[0];
            menuDatePicker.max = availableDates[availableDates.length - 1];
          }

          menuDatePicker.value = initialDate;
          renderForDate(initialDate);

          menuDatePicker.addEventListener("change", () => {
            const selected = menuDatePicker.value;
            if (!selected) {
              return;
            }
            renderForDate(selected);
          });

          menuDateTodayButton.addEventListener("click", () => {
            const today = getIstanbulTodayIso();
            const selected = availableDates.includes(today)
              ? today
              : (availableDates[0] || today);
            menuDatePicker.value = selected;
            renderForDate(selected);
          });
        } catch (error) {
          console.error("Menü verisi alınamadı:", error);
          menuGrid.innerHTML = "<div class='menu-empty'>Günlük menü şu anda yüklenemedi. Kaynak bağlantıları alttan açık.</div>";
          menuStatus.textContent = "Veri alınamadı.";
        }
      }

      loadMenu();
    });
  </script>
</body>

</html>
