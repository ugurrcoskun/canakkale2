<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Otobüs Saatleri — Çanakkale</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(122, 89, 89, 0.633);
      font-family: monospace;
      margin: 0;
      padding: 0;
      color: black;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Geri Dön Butonu */
    .back-btn {
      display: inline-block;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      color: black;
      text-decoration: none;
      background-color: #f0f0f0;
      border: 2px solid black;
      border-radius: 6px;
      padding: 8px 16px;
      box-shadow: 2px 2px 0px black;
      margin-bottom: 18px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-1px, -1px);
    }

    /* Ana Kutu (Retro Brutalist) */
    .box-container {
      border: 7px solid black;
      background-color: #d3d3d3;
      padding: 24px;
      margin: 0 auto 30px auto;
      border-radius: 12px;
    }

    .box-header {
      margin-top: 0;
      margin-bottom: 20px;
      background-color: #8d9cf4;
      color: black;
      padding: 12px;
      text-align: center;
      border: 4px solid black;
      font-size: 1.4em;
      border-radius: 8px;
    }

    /* Tab Butonları */
    .tab-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      justify-content: center;
    }

    .tab-btn {
      flex: 1 1 auto;
      min-width: 100px;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      padding: 10px 16px;
      border: 3px solid black;
      border-radius: 8px;
      background-color: #f0f0f0;
      color: black;
      cursor: pointer;
      text-align: center;
      box-shadow: 2px 2px 0px black;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background-color: #e0e0e0;
      transform: translate(-1px, -1px);
    }

    .tab-btn.active {
      background-color: #8d9cf4;
      color: black;
    }

    /* PDF Listesi */
    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
      min-height: 40px;
    }

    .pdf-item {
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      background-color: #f8f8f8;
      border: 3px solid black;
      border-radius: 8px;
      padding: 10px 16px;
      color: black;
      cursor: pointer;
      text-align: left;
      box-shadow: 2px 2px 0px black;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }

    .pdf-item:hover {
      background-color: #e8e8e8;
      transform: translate(-1px, -1px);
    }

    .pdf-item.active {
      background-color: #8d9cf4;
      color: black;
    }

    .bos-mesaj {
      font-family: monospace;
      font-size: 1.05em;
      color: #333;
      text-align: center;
      padding: 16px;
      font-weight: bold;
    }

    /* PDF Görüntüleyici Kutusu */
    .pdf-viewer-wrap {
      position: relative;
      width: 100%;
      border: 4px solid black;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      margin-bottom: 18px;
      box-shadow: 3px 3px 0px black;
    }

    #pdf-iframe {
      width: 100%;
      height: 75vh;
      min-height: 550px;
      border: none;
      display: block;
    }

    .iframe-placeholder {
      width: 100%;
      height: 75vh;
      min-height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 1.1em;
      font-family: monospace;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      background-color: #f0f0f0;
    }

    /* Alt Butonlar */
    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-btn {
      flex: 1 1 180px;
      font-family: monospace;
      font-size: 1.1em;
      font-weight: bold;
      padding: 12px 18px;
      border: 3px solid black;
      border-radius: 8px;
      background-color: #8d9cf4;
      color: black;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px black;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover:not(.disabled) {
      background-color: #7b8ae0;
      transform: translate(-1px, -1px);
    }

    .action-btn.disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
      background-color: #ccc;
      box-shadow: none;
    }

    /* Mobil Uyumluluk */
    @media (max-width: 600px) {
      .container {
        padding: 12px 8px;
      }

      .box-container {
        border-width: 5px;
        border-radius: 10px;
        padding: 16px 12px;
      }

      .box-header {
        font-size: 1.2em;
        padding: 10px;
        border-width: 3px;
        margin-bottom: 14px;
      }

      .tab-btn {
        font-size: 0.95em;
        padding: 8px 10px;
        border-width: 2px;
        min-width: 80px;
      }

      .pdf-item {
        font-size: 0.95em;
        padding: 8px 12px;
        border-width: 2px;
      }

      #pdf-iframe,
      .iframe-placeholder {
        height: 65vh;
        min-height: 320px;
      }

      .action-btn {
        font-size: 1em;
        padding: 10px 14px;
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="canakkale.html" class="back-btn">‹ Geri</a>

    <div class="box-container">
      <h3 class="box-header">Otobüs Saatleri</h3>

      <!-- Tab Butonları (JS ile dinamik doldurulur) -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- PDF Listesi -->
      <div class="pdf-list" id="pdf-list">
        <div class="bos-mesaj">Yükleniyor...</div>
      </div>

      <!-- PDF Görüntüleyici -->
      <div class="pdf-viewer-wrap">
        <div class="iframe-placeholder" id="iframe-placeholder">
          Görüntülemek için yukarıdan bir PDF seçin.
        </div>
        <iframe id="pdf-iframe" title="PDF Görüntüleyici" style="display:none;"></iframe>
      </div>

      <!-- Alt Butonlar -->
      <div class="action-bar">
        <a id="btn-indir" class="action-btn disabled" href="#" download>PDF İndir</a>
        <a id="btn-yeni-sekme" class="action-btn disabled" href="#" target="_blank" rel="noopener noreferrer">Yeni Sekmede Aç</a>
        <a id="btn-belediye" class="action-btn" href="https://ulasim.canakkale.bel.tr/rehber/hatlar-otobus-saatleri/"
          target="_blank" rel="noopener noreferrer">Belediye Sitesine Git</a>
      </div>
    </div>
  </div>

  <script>
    const DATA_URL = "../data/links.json";

    let activeCat = null;
    let activePdfUrl = null;
    let linksData = {};

    const LABELS = {
      haftaici: "Hafta İçi",
      haftasonu: "Hafta Sonu",
      arefe: "Arefe",
      bayram: "Bayram",
      diger: "Diğer",
    };

    const tabBar = document.getElementById("tab-bar");
    const pdfList = document.getElementById("pdf-list");
    const iframe = document.getElementById("pdf-iframe");
    const placeholder = document.getElementById("iframe-placeholder");
    const btnIndir = document.getElementById("btn-indir");
    const btnYeni = document.getElementById("btn-yeni-sekme");

    /* ---- PDF göster ---- */
    function setActivePdf(url, searchTerm) {
      activePdfUrl = url;

      if (!url) {
        iframe.style.display = "none";
        placeholder.style.display = "flex";
        btnIndir.classList.add("disabled");
        btnIndir.removeAttribute("href");
        btnYeni.classList.add("disabled");
        btnYeni.removeAttribute("href");
        return;
      }

      const hash = searchTerm
        ? "#search=" + encodeURIComponent(searchTerm)
        : "";

      let finalUrl = url + hash;

      if (window.innerWidth <= 768) {
        finalUrl = "https://docs.google.com/viewer?url=" + encodeURIComponent(url) + "&embedded=true";
      }

      if (iframe.src !== finalUrl) {
        iframe.src = finalUrl;
      }
      iframe.style.display = "block";
      placeholder.style.display = "none";

      btnIndir.href = url;
      btnIndir.classList.remove("disabled");
      btnYeni.href = url;
      btnYeni.classList.remove("disabled");
    }

    /* ---- PDF listesi render ---- */
    function renderList(cat, autoSelect) {
      const items = linksData[cat] || [];

      if (items.length === 0) {
        pdfList.innerHTML = '<div class="bos-mesaj">Bu kategori için PDF bulunamadı.</div>';
        setActivePdf(null);
        return;
      }

      pdfList.innerHTML = "";
      items.forEach(function (item, idx) {
        const div = document.createElement("div");
        div.className = "pdf-item";
        div.textContent = item.label || item.url.split("/").pop();
        div.title = item.url;
        div.dataset.url = item.url;

        div.addEventListener("click", function () {
          pdfList.querySelectorAll(".pdf-item").forEach(d => d.classList.remove("active"));
          div.classList.add("active");
          setActivePdf(item.url);
        });

        pdfList.appendChild(div);

        if (idx === 0 && autoSelect !== false) {
          div.classList.add("active");
          setActivePdf(item.url);
        }
      });
    }

    /* ---- Render Tabs ---- */
    function renderTabs() {
      tabBar.innerHTML = "";
      const availableCats = [];

      for (const cat in LABELS) {
        if (linksData[cat] && linksData[cat].length > 0) {
          availableCats.push({ cat: cat, label: LABELS[cat] });
        }
      }

      if (availableCats.length === 0) {
        tabBar.style.display = "none";
        pdfList.innerHTML = '<div class="bos-mesaj">Şu an hiç otobüs saati dosyası bulunmuyor.</div>';
        setActivePdf(null);
        return;
      }

      tabBar.style.display = "flex";

      availableCats.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.cat = item.cat;
        btn.textContent = item.label;
        tabBar.appendChild(btn);
      });

      const firstCat = availableCats[0].cat;
      activeCat = firstCat;
      const firstTabBtn = tabBar.querySelector(`[data-cat="${firstCat}"]`);
      if (firstTabBtn) firstTabBtn.classList.add("active");
      renderList(firstCat);
    }

    /* ---- Tab değişimi ---- */
    tabBar.addEventListener("click", function (e) {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      tabBar.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCat = btn.dataset.cat;
      renderList(activeCat);
    });

    /* ---- Veriyi yükle ---- */
    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        linksData = await res.json();
      } catch (e) {
        pdfList.innerHTML = '<div class="bos-mesaj">Veriler yüklenemedi. Lütfen daha sonra tekrar deneyin.</div>';
        console.error("links.json yüklenemedi:", e);
        return;
      }
      renderTabs();
    }

    loadData();
  </script>
</body>

</html>
