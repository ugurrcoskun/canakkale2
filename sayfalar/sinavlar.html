<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sınavlar — Çanakkale</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(122, 89, 89, 0.633);
      font-family: monospace;
      margin: 0;
      padding: 0;
      color: black;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-btn {
      display: inline-block;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      color: black;
      text-decoration: none;
      background-color: #f0f0f0;
      border: 2px solid black;
      border-radius: 6px;
      padding: 8px 16px;
      box-shadow: 2px 2px 0px black;
      margin-bottom: 18px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-1px, -1px);
    }

    .box-container {
      border: 7px solid black;
      background-color: #d3d3d3;
      padding: 24px;
      margin: 0 auto 30px auto;
      border-radius: 12px;
      text-align: center;
    }

    .box-header {
      margin-top: 0;
      margin-bottom: 24px;
      background-color: #8d9cf4;
      color: black;
      padding: 12px;
      text-align: center;
      border: 4px solid black;
      font-size: 1.4em;
      border-radius: 8px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-btn {
      font-family: monospace;
      font-size: 1.15em;
      font-weight: bold;
      padding: 14px 20px;
      background-color: #f0f0f0;
      border: 3px solid black;
      border-radius: 8px;
      color: black;
      text-decoration: none;
      box-shadow: 3px 3px 0px black;
      transition: all 0.15s ease;
      display: block;
    }

    .menu-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px black;
    }

    .menu-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px black;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px 8px;
      }

      .box-container {
        border-width: 5px;
        border-radius: 10px;
        padding: 18px 14px;
      }

      .box-header {
        font-size: 1.2em;
        padding: 10px;
        border-width: 3px;
      }

      .menu-btn {
        font-size: 1.05em;
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="okul.html" class="back-btn">‹ Okul</a>

    <div class="box-container">
      <h3 class="box-header">Sınavlar</h3>
      <div class="menu-list">
        <a href="finaller1.html" class="menu-btn">FİNALLER 1</a>
      </div>
    </div>
  </div>
</body>

</html>
