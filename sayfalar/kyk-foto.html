<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYK Yemek Fotoğrafları — Çanakkale</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(122, 89, 89, 0.633);
      font-family: monospace;
      margin: 0;
      padding: 0;
      color: black;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Geri Dön Butonu */
    .back-btn {
      display: inline-block;
      font-family: monospace;
      font-size: 1.05em;
      font-weight: bold;
      color: black;
      text-decoration: none;
      background-color: #f0f0f0;
      border: 2px solid black;
      border-radius: 6px;
      padding: 8px 16px;
      box-shadow: 2px 2px 0px black;
      margin-bottom: 18px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background-color: #8d9cf4;
      transform: translate(-1px, -1px);
    }

    /* Ana Kutu */
    .box-container {
      border: 7px solid black;
      background-color: #d3d3d3;
      padding: 24px;
      margin: 0 auto 30px auto;
      border-radius: 12px;
      text-align: center;
    }

    .box-header {
      margin-top: 0;
      margin-bottom: 20px;
      background-color: #8d9cf4;
      color: black;
      padding: 12px;
      text-align: center;
      border: 4px solid black;
      font-size: 1.4em;
      border-radius: 8px;
    }

    /* Fotoğraf Kartları */
    .photo-card {
      background-color: #f8f8f8;
      border: 4px solid black;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 3px 3px 0px black;
      margin-bottom: 24px;
      text-align: center;
    }

    .photo-title {
      display: inline-block;
      font-size: 1.2em;
      font-weight: bold;
      background-color: #8d9cf4;
      border: 2px solid black;
      border-radius: 6px;
      padding: 6px 18px;
      margin-bottom: 16px;
    }

    .photo-img {
      width: 100%;
      max-width: 600px;
      border: 3px solid black;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px 8px;
      }

      .box-container {
        border-width: 5px;
        border-radius: 10px;
        padding: 16px 12px;
      }

      .box-header {
        font-size: 1.2em;
        padding: 10px;
        border-width: 3px;
      }

      .photo-card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="yemek.html" class="back-btn">‹ Yemek Menüsü</a>

    <div class="box-container">
      <h3 class="box-header">KYK Yemek Fotoğrafları</h3>

      <div class="photo-card">
        <div class="photo-title">SABAH MENÜSÜ</div>
        <img class="photo-img" src="../resimler/yemek/sabah.jpg" alt="KYK Sabah Menüsü" />
      </div>

      <div class="photo-card">
        <div class="photo-title">AKŞAM MENÜSÜ</div>
        <img class="photo-img" src="../resimler/yemek/aksam.jpg" alt="KYK Akşam Menüsü" />
      </div>
    </div>
  </div>
</body>

</html>
